[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "background-remove-sdk"
version = "0.1.0"
description = "Remove image backgrounds with one call. Includes CLI, agent-framework tools, and an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sangbum Choi" }]
keywords = ["background-removal", "image-segmentation", "computer-vision", "agents", "mcp", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "transparent-background>=1.2.4",
    "Pillow>=9.0",
    "numpy>=1.21",
    "opencv-python>=4.5",
]

[project.optional-dependencies]
server = ["flask>=2.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/SangbumChoi/background-removal-api"

[project.scripts]
bg-remove = "background_remove_sdk.cli:main"
bg-remove-server = "background_remove_sdk.server:main"
bg-remove-mcp = "background_remove_sdk.agents.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
