name: Publish to PyPI

# Publishes when a GitHub Release is published (e.g. tag v0.1.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token secret required.
# One-time setup on https://pypi.org -> your account -> Publishing:
#   project: background-remove-sdk, owner: SangbumChoi,
#   repo: background-removal-api, workflow: publish.yml, environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/background-remove-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
